name: Fetch Secrets from Conjur

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Select target Conjur environment'
        required: true
        default: 'conjur_demo_1'
        type: choice
        options:
          - conjur_demo_1
          - conjur_demo_2
  push:
    branches:
      - main

jobs:
  fetch-secrets:
    # Dynamically bind to the chosen environment (defaults to primary on push)
    environment: ${{ inputs.target_environment || 'conjur-demo-primary' }}
    runs-on: self-hosted
    permissions:
      id-token: write
      contents: read

    steps:
    # NEW DEBUG STEP: Echo the secret path bracketed by pipes to expose any invisible trailing spaces
      - name: Debug Conjur Secrets Path
        run: |
          echo "CONJUR_SECRETS_PATH is: |${{ secrets.CONJUR_SECRETS_PATH }}|"
          echo "Expected format: |data/vault/dodge_test/Ansible-DBA-MySQL/password|"
          
      - name: Retrieve secrets from Conjur
        uses: cyberark/conjur-action@v2.0.5
        with:
          url: ${{ secrets.CONJUR_URL }}
          account: ${{ secrets.ACCOUNT || 'conjur' }}
          authn_id: ${{ secrets.AUTHN_ID }}
          secrets: ${{ secrets.CONJUR_SECRETS_PATH }}|CONJUR_PASS;

      - name: Verify Secret Fetch
        run: |
          echo "$CONJUR_PASS" | sed 's/./& /g'
