name: Fetch Secrets from Conjur

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Select target Conjur environment'
        required: true
        default: 'conjur_demo_1'
        type: choice
        options:
          - conjur_demo_1
          - conjur_demo_2
  push:
    branches:
      - main

jobs:
  fetch-secrets:
    # Dynamically bind to the chosen environment (defaults to primary on push)
    environment: ${{ inputs.target_environment || 'conjur_demo_1' }}
    runs-on: self-hosted
    permissions:
      id-token: write
      contents: read

    steps:          
      - name: Retrieve secrets from Conjur
        uses: cyberark/conjur-action@v2.0.5
        with:
          url: ${{ vars.CONJUR_URL }}
          account: ${{ vars.ACCOUNT }}
          authn_id: ${{ vars.AUTHN_ID }}
          secrets: |
            ${{ vars.CONJUR_SECRETS_PATH }}|CONJUR_PASS;

      - name: Verify Secret Fetch
        run: |
          echo "$CONJUR_PASS" | sed 's/./& /g'
